name: Update shortwave schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source import
        run: python update_database.py
      - name: Commit validated data
        run: |
          git config user.name 'radio-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senderdaten.json
          git diff --cached --quiet || (git commit -m 'Refresh shortwave schedules' && git push)
