name: Update shortwave schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'hfcc_html.py'
      - 'eibi_mirror.py'
      - 'test_eibi_mirror.py'
      - 'update_database.py'
      - 'test_hfcc_html.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: schedule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test schedule parser
        run: python -m unittest test_hfcc_html test_eibi_mirror -v
      - name: Fetch and validate HFCC + mirrored EiBi schedules
        run: python update_database.py
      - name: Commit validated data
        run: |
          git config user.name 'radio-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Re-apply the validated output to the newest main each time.
          # This avoids conflicts when the importer runs during a code edit.
          cp senderdaten.json "$RUNNER_TEMP/validated-senderdaten.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/validated-senderdaten.json" senderdaten.json
            git add senderdaten.json
            if git diff --cached --quiet; then
              echo 'No database change'
              exit 0
            fi
            git commit -m 'Refresh verified HFCC and EiBi schedules'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Could not publish validated database after three attempts' >&2
          exit 1
