name: Update shortwave schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'hfcc_html.py'
      - 'update_database.py'
      - 'test_hfcc_html.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: schedule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test schedule parser
        run: python -m unittest test_hfcc_html -v
      - name: Fetch and validate official HFCC schedules
        run: python update_database.py
      - name: Commit validated data
        run: |
          git config user.name 'radio-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senderdaten.json
          git diff --cached --quiet || (git commit -m 'Refresh verified HFCC timetable' && git push)
