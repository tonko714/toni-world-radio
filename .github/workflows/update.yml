name: Update shortwave schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'hfcc_html.py'
      - 'update_database.py'
      - 'test_hfcc_html.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: schedule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test schedule parser
        run: python -m unittest test_hfcc_html -v
      - name: Fetch and validate official HFCC schedules
        run: python update_database.py
      - name: Commit validated data
        run: |
          git config user.name 'radio-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senderdaten.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified HFCC timetable'
            # Other edits may have reached main during the 20-second download.
            # Rebase on latest main and retry without ever force-pushing.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo 'Could not publish schedule after three attempts' >&2
            exit 1
          fi
